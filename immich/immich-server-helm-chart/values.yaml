## Image parameters

## Immich server image repository
## Immich server image tag
## Check https://github.com/immich-app/immich/releases for available tags.
##
image:
  repository: ghcr.io/immich-app/immich-server
  tag: "v3.2.2"

## External dependency parameters

## Kubernetes DNS name of the PostgreSQL Service
## Defaults to the bundled CNPG Cluster's read-write Service ("<cluster>-rw")
## when cnpg.enabled. Set it only to connect to a different PostgreSQL, e.g.
## "immich-db" for the companion database chart.
##
databaseHost: ""

## Kubernetes DNS name of the Redis Service
## Defaults to the bundled Valkey Service ("<release>-valkey") when
## valkey.enabled. Set it only to connect to a different Redis/Valkey.
## Avoid a Service literally named "redis": Kubernetes then injects a
## REDIS_PORT env var (tcp://...) that clashes with Immich's own REDIS_PORT.
##
redisHost: ""

## Name of the PostgreSQL database Immich should connect to
## Keep in sync with cnpg.cluster.initdb.database.
##
databaseName: immich

## PostgreSQL credential parameters
##
## Credentials are read from a Kubernetes Secret so that plaintext passwords
## never appear in values files or Helm releases.
##
## With cnpg.enabled and secretName left empty, the CNPG Cluster's app secret
## is used ("<cluster>-app", or cnpg.cluster.initdb.secret.name when set).
## Otherwise create the Secret before installing this chart:
##   kubectl create secret generic postgres-secret \
##     --from-literal=username=immich \
##     --from-literal=password=changeme
##

## Name of the Secret containing the PostgreSQL username
## Key within the Secret that holds the username value
##
postgresUser:
  secretName: ""
  key: username

## Name of the Secret containing the PostgreSQL password
## Key within the Secret that holds the password value
##
postgresPassword:
  secretName: ""
  key: password

## Valkey parameters
##
## Deploys Valkey (a Redis-compatible store) through the official valkey chart,
## imported as a dependency under this key. Everything except `enabled` is
## passed straight to that chart; see its values for all options:
## https://github.com/valkey-io/valkey-helm/blob/main/valkey/values.yaml
## Set enabled: false to use an external Redis/Valkey via redisHost instead.
##
valkey:
  ## Deploy Valkey
  enabled: true
  ## Service/workload name. Defaults to "<release>-valkey" when empty.
  fullnameOverride: ""
  auth:
    ## Authentication is off; the Service is only reachable in-cluster.
    ## If you enable it, connect with credentials via redisHost instead.
    enabled: false
  dataStorage:
    ## Persist data to a PVC. Off by default: Valkey holds only queue/cache
    ## state here.
    enabled: false
  ## Resource requests and limits for the Valkey pod
  resources: {}

## CloudNativePG parameters
##
## Deploys a CNPG Cluster on the Immich-patched PostgreSQL image (VectorChord +
## pgvector) through the cloudnative-pg "cluster" chart, imported as a
## dependency under this key. Everything except `enabled` is passed straight
## to that chart; see its values for all options:
## https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/values.yaml
## Requires the CloudNativePG operator (and its CRDs) in the cluster.
## Set enabled: false to use an external PostgreSQL via databaseHost instead.
##
cnpg:
  ## Deploy the CNPG Cluster
  enabled: true
  ## Cluster name. Defaults to "<release>-cnpg" when empty.
  fullnameOverride: ""
  type: postgresql
  version:
    postgresql: "18"
  cluster:
    ## Number of PostgreSQL instances
    instances: 1
    ## Immich-patched PostgreSQL image. Check https://github.com/immich-app/postgres
    ## for available tags; the major version must match version.postgresql.
    imageName: "ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5"
    ## The image runs postgres as UID/GID 999 (docker-library convention),
    ## not CNPG's default of 26; initdb fails without this.
    postgresUID: 999
    postgresGID: 999
    storage:
      ## PVC size
      size: 10Gi
      ## Storage class name. Leave empty to use the cluster default storage class.
      storageClass: ""
    postgresql:
      shared_preload_libraries:
        - vchord.so
    ## Resource requests and limits for the PostgreSQL pods
    resources: {}
    initdb:
      ## Database created on first bootstrap
      database: immich
      ## Owner role of that database
      owner: immich
      ## The owner is not a superuser, so Immich cannot create these itself on startup
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
      ## Existing kubernetes.io/basic-auth Secret (username/password keys) to
      ## seed the owner's credentials. When unset, CNPG generates "<cluster>-app".
      ## e.g.:
      ## secret:
      ##   name: immich-postgresql-secret
  ## Backups via barman-cloud. See the cluster chart's values for configuration.
  backups:
    enabled: false

## Immich environment parameters

env:
  ## Path inside the container where uploaded media is stored
  ## Must match the mountPath of the upload PersistentVolumeClaim.
  uploadLocation: /usr/src/app/upload
  ## Log verbosity level
  ## One of: verbose | debug | log | warn | error
  loglevel: log

## Persistence parameters

persistence:
  ## Enable a PersistentVolumeClaim for uploaded media
  enabled: true
  ## StorageClass for the upload PVC ("" uses the cluster default)
  storageClass: ""
  ## PVC access mode
  accessMode: ReadWriteOnce
  ## Size of the upload PVC
  ## Scale based on your library. 50Gi suits a small personal library;
  ## larger collections (>50k photos) may need 200Gi+.
  size: 50Gi

## Service parameters

service:
  ## Kubernetes Service type
  ## Use ClusterIP when exposing via Ingress; LoadBalancer for a direct external IP.
  type: ClusterIP
  ## Service port
  port: 80
  ## Port Immich listens on inside the container
  targetPort: 2283

## Resource parameters

## CPU and memory requests and limits
##
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 2Gi
  # requests:
  #   cpu: 10m
  #   memory: 25Mi

## Scheduling parameters

## Node labels for pod assignment
## Leave empty ({}) to allow scheduling on any node.
## e.g.:
##   nodeSelector:
##     node-role: app
##
nodeSelector: {}

## Affinity for pod assignment
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
## e.g. prefer not to co-locate the server and ML pods on the same node:
##   affinity:
##     podAntiAffinity:
##       preferredDuringSchedulingIgnoredDuringExecution:
##         - weight: 1
##           podAffinityTerm:
##             labelSelector:
##               matchLabels:
##                 app.kubernetes.io/component: machine-learning
##             topologyKey: kubernetes.io/hostname
##
affinity: {}

## Tolerations for pod scheduling
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
## e.g.:
##   tolerations:
##     - key: "dedicated"
##       operator: "Equal"
##       value: "immich"
##       effect: "NoSchedule"
##
tolerations: []

## Machine Learning parameters

machineLearning:
  ## Deploy the Machine Learning sidecar
  ## Provides CLIP smart search and facial recognition.
  ## Disable if your nodes lack the resources or you prefer to run ML separately
  ## via the companion immich-ml-helper-chart.
  ##
  enabled: true

  ## ML container image repository
  ## ML container image tag
  ##
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v3.2.2"

  ## Extra environment variables for the ML container
  ## Provide as a map of key/value pairs.
  ##
  env: {}

  ## Node labels for ML pod assignment
  ## Machine learning workloads require amd64 by default. Adjust or remove for arm64 clusters.
  ## e.g.:
  ##   nodeSelector:
  ##     kubernetes.io/arch: amd64
  ##
  nodeSelector: {}

  ## Affinity for ML pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  ## e.g. require scheduling onto nodes labelled for ML workloads:
  ##   affinity:
  ##     nodeAffinity:
  ##       requiredDuringSchedulingIgnoredDuringExecution:
  ##         nodeSelectorTerms:
  ##           - matchExpressions:
  ##               - key: workload-type
  ##                 operator: In
  ##                 values:
  ##                   - ml
  ##
  affinity: {}

  ## Tolerations for ML pod scheduling
  ## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  ## e.g. allow scheduling onto a GPU-tainted node:
  ##   tolerations:
  ##     - key: "nvidia.com/gpu"
  ##       operator: "Exists"
  ##       effect: "NoSchedule"
  ##
  tolerations: []

  ## Enable a PersistentVolumeClaim for the model cache
  ## Without persistence, models are re-downloaded on every restart (~2–5 Gi).
  ## StorageClass for the model-cache PVC ("" uses the cluster default)
  ## PVC access mode
  ## Size of the model-cache PVC
  ##
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

  ## CPU and memory requests and limits for the ML container
  ##
  resources: {}
    # limits:
    #   cpu: "2"
    #   memory: 4Gi
    # requests:
    #   cpu: 10m
    #   memory: 25Mi

## Ingress parameters

ingress:
  ## Enable an Ingress resource
  ## Requires an Ingress controller installed in the cluster (e.g. ingress-nginx).
  ##
  enabled: false

  ## IngressClass to use
  ## Run `kubectl get ingressclass` to list available classes.
  ##
  ingressClassName: "nginx"

  ## Additional annotations for the Ingress resource
  ## Annotations are controller-specific. Examples:
  ##
  ## ingress-nginx:
  ##   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  ##   nginx.ingress.kubernetes.io/proxy-body-size: 4G
  ##
  ## Cloudflare Tunnel + external-dns:
  ##   external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  ##   external-dns.alpha.kubernetes.io/hostname: immich.example.com
  ##   external-dns.alpha.kubernetes.io/target: <tunnel-id>.cfargotunnel.com
  ##
  annotations: {}

  ## Hostname at which Immich will be served
  ##
  host: immich.example.com

  ## Path prefix for the Immich Ingress rule
  ##
  path: /

  ## TLS configuration for the Ingress resource
  ## Leave empty if your proxy (e.g. Cloudflare) handles TLS termination upstream.
  ## To use cert-manager:
  ##   tls:
  ##     - secretName: immich-tls
  ##       hosts:
  ##         - immich.example.com
  ##
  tls: []

## HTTPRoute parameters (Gateway API)

httpRoute:
  ## Enable an HTTPRoute resource
  ## Requires the Kubernetes Gateway API CRDs and a Gateway API implementation
  ## (e.g. Istio, Envoy Gateway, Cilium) installed in the cluster, plus an
  ## existing Gateway resource to attach to.
  ##
  enabled: false
  ## References to the Gateway(s) this HTTPRoute attaches to
  ## Ref: https://gateway-api.sigs.k8s.io/reference/api-types/httproute/#attaching-to-gateways
  ## e.g.:
  ##   parentRefs:
  ##     - name: my-gateway
  ##       namespace: gateway-system
  ##
  parentRefs: []
  ## Hostname at which Immich will be served
  ##
  host: immich.example.com
  ## Path prefix for the Immich HTTPRoute rule
  ##
  path: /
  ## Additional labels for the HTTPRoute resource
  ##
  labels: {}
  ## Additional annotations for the HTTPRoute resource
  ##
  extraAnnotations: {}

## Metrics parameters

metrics:
  ## Enable Prometheus metrics on the Immich server
  ## Sets IMMICH_TELEMETRY_INCLUDE=all and exposes the api (8081) and
  ## background-jobs (8082) metrics ports.
  ##
  enabled: false

  serviceMonitor:
    ## Create a ServiceMonitor for the Prometheus Operator / VictoriaMetrics Operator
    ## Requires the monitoring.coreos.com/v1 ServiceMonitor CRD to be installed in the cluster.
    ##
    enabled: true
    ## Namespace to deploy the ServiceMonitor into
    ## Empty string uses the release namespace.
    ##
    namespace: ""
    ## Scrape interval
    ##
    interval: "30s"
    ## Scrape timeout (empty uses the operator/global default)
    ##
    scrapeTimeout: ""
    ## Preserve metric labels that collide with target labels
    ##
    honorLabels: false
    ## RelabelConfigs applied to samples before scraping
    ## Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
    ##
    relabelings: []
    ## MetricRelabelConfigs applied to samples before ingestion
    ##
    metricRelabelings: []
    ## Additional labels for the ServiceMonitor metadata
    ## Set these if your Prometheus/VMAgent only discovers ServiceMonitors matching
    ## specific labels (serviceMonitorSelector / serviceScrapeSelector).
    ##
    additionalLabels: {}
    ## Additional annotations for the ServiceMonitor metadata
    ##
    annotations: {}
