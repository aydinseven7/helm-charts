apiVersion: v2
name: immich
version: 0.2.0
appVersion: "v3.3.5"
description: A Helm chart for deploying the Immich server and Machine Learning components
maintainers:
  - name: aydinseven7
keywords:
  - immich
  - server
home: https://immich.app
sources:
  - https://github.com/immich-app/immich
dependencies:
  - name: cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    alias: cnpg
    condition: cnpg.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
