apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich-server.fullname" . }}-svc
  labels:
    {{- include "immich-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: metrics-api
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: metrics-ms
    {{- end }}
  selector:
    {{- include "immich-server.selectorLabels" . | nindent 4 }}
