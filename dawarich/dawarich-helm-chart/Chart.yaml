apiVersion: v2
name: dawarich
version: 0.2.1
appVersion: "1.16.0"
description: A Helm chart for deploying the Dawarich server
keywords:
  - dawarich
sources:
  - https://github.com/Freika/dawarich
dependencies:
  - name: cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    alias: cnpg
    condition: cnpg.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled