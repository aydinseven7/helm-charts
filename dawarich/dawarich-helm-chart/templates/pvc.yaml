    {{- include "dawarich.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.storage.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage.size | default "1Gi" }}
  {{- if .Values.persistence.storage.storageClass }}
  storageClassName: {{ .Values.persistence.storage.storageClass }}
  {{- end }}
{{- end }}
---
{{- if .Values.persistence.db.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
