{{- if .Values.persistence.public.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dawarich.fullname" . }}-dawarich-public-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.public.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.public.size | default "1Gi" }}
  {{- if .Values.persistence.public.storageClass }}
  storageClassName: {{ .Values.persistence.public.storageClass }}
  {{- end }}
{{- end }}
---
{{- if .Values.persistence.watched.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dawarich.fullname" . }}-dawarich-watched-pvc
