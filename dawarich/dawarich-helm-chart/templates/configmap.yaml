apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dawarich.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
data:
  DATABASE_NAME: {{ .Values.database.name | quote }}
  APPLICATION_HOSTS: {{ .Values.ingress.host | quote }}
  TIME_ZONE: {{ .Values.env.timeZone | default "UTC" | quote }}
  APPLICATION_PROTOCOL: {{ .Values.env.APPLICATION_PROTOCOL | quote }}
  PROMETHEUS_EXPORTER_ENABLED: {{ .Values.env.PROMETHEUS_EXPORTER_ENABLED | quote }}
  PROMETHEUS_EXPORTER_PORT: {{ .Values.env.PROMETHEUS_EXPORTER_PORT | quote }}
  SELF_HOSTED: "true"
  {{- if .Values.sidekiq.enabled }}
  SIDEKIQ_METRICS_URL: {{ .Values.env.SIDEKIQ_METRICS_URL | quote }}
  BACKGROUND_PROCESSING_CONCURRENCY: {{ .Values.env.BACKGROUND_PROCESSING_CONCURRENCY | quote }}
  RAILS_MAX_THREADS: {{ .Values.env.RAILS_MAX_THREADS | default .Values.env.BACKGROUND_PROCESSING_CONCURRENCY | quote }}
  {{- else }}
  BACKGROUND_PROCESSING_CONCURRENCY: {{ .Values.sidekiq.embedded.concurrency | quote }}
  {{- with .Values.env.RAILS_MAX_THREADS }}
  RAILS_MAX_THREADS: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.env.REVERSE_GEOCODING_CONCURRENCY }}
  REVERSE_GEOCODING_CONCURRENCY: {{ . | quote }}
  {{- end }}
  STORE_GEODATA: {{ .Values.env.STORE_GEODATA | quote }}
  RAILS_ENV: {{ .Values.env.RAILS_ENV | quote }}
  RAILS_APPLICATION_CONFIG_HOSTS: {{ .Values.env.RAILS_APPLICATION_CONFIG_HOSTS | default .Values.ingress.host | quote }}
  REDIS_URL: {{ include "dawarich.redis.url" . | quote }}
  DATABASE_HOST: {{ include "dawarich.database.host" . | quote }}
  {{- if not (include "dawarich.database.cnpgSecret" .) }}
  DATABASE_USERNAME: {{ required "database.username is required when not using the CNPG app secret" .Values.database.username | quote }}
  {{- end }}
  SMTP_SERVER: {{ .Values.smtp.address | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_DOMAIN: {{ .Values.smtp.domain | quote }}
  SMTP_USERNAME: {{ .Values.smtp.username | quote }}
