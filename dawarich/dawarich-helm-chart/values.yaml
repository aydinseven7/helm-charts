## Override the name of the chart
nameOverride: ""
## Override the fully qualified app name
fullnameOverride: ""

## Image parameters
image:
  ## Dawarich image repository
  repository: freikin/dawarich
  ## Dawarich image tag
  ## Defaults to Chart.AppVersion when empty
  tag: ""

## Service parameters
service:
  ## Enable the service
  enabled: true
  ## Service port
  port: 3000
  ## Service type
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  ## Container port to route traffic to
  targetPort: 3000
  ## Protocol used by the service
  protocol: TCP
  ## Additional annotations for the service
  annotations: {}
  ## Additional labels for the service
  labels: {}

## Ingress parameters
ingress:
  ## Enable ingress
  enabled: true
  ## Additional annotations for the ingress
  ## e.g.:
  ## annotations:
  ##   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  ##   nginx.ingress.kubernetes.io/proxy-body-size: 4G
  annotations: {}
  ## IngressClass that will be used to implement the Ingress
  ingressClassName: ""
  ## Path for the ingress rule
  path: "/"
  ## Hostname for the ingress
  host: "dawarich.example.com"
  ## TLS configuration
  ## e.g.:
  ## tls:
  ##   - secretName: dawarich-tls
  ##     hosts:
  ##       - dawarich.example.com
  tls: []

## HTTPRoute parameters
## ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  ## Enable HTTPRoute (Gateway API). Mutually exclusive with ingress.
  enabled: false
  ## Additional annotations for the HTTPRoute
  annotations: {}
  ## Gateways this route should attach to
  ## e.g.:
  ## parentRefs:
  ##   - name: my-gateway
  ##     namespace: gateway-system
  parentRefs: []
  ## Hostnames this route matches. Defaults to ingress.host if empty.
  hostnames: []
  ## Additional rules appended to the HTTPRoute spec.rules list
  ## e.g.:
  ## extraRules:
  ##   - matches:
  ##       - path:
  ##           type: PathPrefix
  ##           value: /api
  ##     backendRefs:
  ##       - name: my-api-svc
  ##         port: 8080
  extraRules: []

## Application environment parameters
env:
  ## Rails environment
  RAILS_ENV: production
  ## Comma-separated list of allowed hostnames
  APPLICATION_HOSTS: dawarich.example.com
  ## Number of concurrent Sidekiq workers
  BACKGROUND_PROCESSING_CONCURRENCY: 10
  ## ActiveRecord connection pool size; must be >= BACKGROUND_PROCESSING_CONCURRENCY.
  ## Defaults to BACKGROUND_PROCESSING_CONCURRENCY when empty
  RAILS_MAX_THREADS: ""
  ## Max Sidekiq workers on the reverse_geocoding queue. Dawarich defaults to a third
  ## of BACKGROUND_PROCESSING_CONCURRENCY when empty; raise it for a self-hosted Photon
  REVERSE_GEOCODING_CONCURRENCY: ""
  ## Protocol the app is served over (http or https)
  APPLICATION_PROTOCOL: http
  ## Enable Prometheus metrics export
  PROMETHEUS_EXPORTER_ENABLED: "false"
  ## Port the in-process Sidekiq metrics exporter binds to
  PROMETHEUS_EXPORTER_PORT: "9394"
  ## Internal URL the web container uses to fetch Sidekiq metrics.
  ## Override when the Sidekiq container hostname differs from the docker-compose default
  ## (e.g. use http://localhost:9394/metrics on Kubernetes where both run in the same pod).
  SIDEKIQ_METRICS_URL: "http://localhost:9394/metrics"
  ## Persist downloaded reverse-geocoding data locally
  STORE_GEODATA: "true"
  ## Additional trusted hosts for Rails (defaults to ingress.host if unset)
  RAILS_APPLICATION_CONFIG_HOSTS: ""
  ## Timezone used by the application
  timeZone: "UTC"

## SMTP parameters
smtp:
  ## SMTP server address
  address: "smtp.example.com"
  ## SMTP server port
  port: 587
  ## SMTP HELO domain
  domain: "example.com"
  ## SMTP login username
  username: "user@example.com"
  ## SMTP password (ignored if existingSecret.name is set)
  password: ""
  ## Reference to an existing secret containing the SMTP password
  existingSecret:
    ## Name of the existing secret
    name: "dawarich-secret"
    ## Key within the secret for the SMTP password
    key: "smtp-password"

## Database parameters
## With cnpg.enabled (the default), host and credentials default to the bundled
## CloudNativePG Cluster: host "<cluster>-rw", username/password from the
## Cluster's app secret. Set them only to connect to a different PostgreSQL.
database:
  ## Reference to an existing secret containing the database password.
  ## When empty and cnpg.enabled, the CNPG app secret is used for both the
  ## username and password.
  existingSecret:
    ## Name of the existing secret
    name: ""
    ## Key within the secret for the database password
    key: "password"
  ## PostgreSQL host. Defaults to "<cluster>-rw" when cnpg.enabled.
  host: ""
  ## PostgreSQL username. Ignored when the username comes from the CNPG app secret.
  username: ""
  ## Database password (ignored if existingSecret.name is set or the CNPG app secret is used)
  password: ""
  ## Database name. Keep in sync with cnpg.cluster.initdb.database.
  name: "dawarich"

## CloudNativePG parameters
## Deploys a PostGIS-enabled CNPG Cluster through the cloudnative-pg "cluster"
## chart, imported as a dependency under this key. Everything except `enabled`
## is passed straight to that chart; see its values for all options:
## https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/values.yaml
## Requires the CloudNativePG operator (and its CRDs) in the cluster.
## Set enabled: false to use an external PostgreSQL/PostGIS via database.* instead.
cnpg:
  ## Deploy the CNPG Cluster
  enabled: true
  ## Cluster name. Defaults to "<release>-cnpg" when empty.
  fullnameOverride: ""
  ## Database type; postgis creates the PostGIS extensions on initdb
  type: postgis
  version:
    postgresql: "17"
    postgis: "3.6"
  cluster:
    ## Number of PostgreSQL instances
    instances: 1
    ## PostGIS image used by the operator
    imageName: "ghcr.io/cloudnative-pg/postgis:17-3.6-system-trixie"
    storage:
      ## PVC size
      size: 5Gi
      ## Storage class name. Leave empty to use the cluster default storage class.
      storageClass: ""
    ## Resource requests and limits for the PostgreSQL pods
    resources: {}
    initdb:
      ## Database created on first bootstrap
      database: dawarich
      ## Owner role of that database
      owner: dawarich
      ## Existing kubernetes.io/basic-auth Secret (username/password keys) to
      ## seed the owner's credentials. When unset, CNPG generates "<cluster>-app".
      ## e.g.:
      ## secret:
      ##   name: dawarich-postgres-secret
  ## Backups via barman-cloud. See the cluster chart's values for configuration.
  backups:
    enabled: false

## Redis parameters
redis:
  ## Redis connection URL. Defaults to the bundled Valkey Service
  ## ("redis://<release>-valkey:6379") when valkey.enabled.
  host: ""

## Valkey parameters
##
## Deploys Valkey (a Redis-compatible store) through the official valkey chart,
## imported as a dependency under this key. Everything except `enabled` is
## passed straight to that chart; see its values for all options:
## https://github.com/valkey-io/valkey-helm/blob/main/valkey/values.yaml
## Set enabled: false to use an external Redis/Valkey via redis.host instead.
##
valkey:
  ## Deploy Valkey
  enabled: true
  ## Service/workload name. Defaults to "<release>-valkey" when empty.
  fullnameOverride: ""
  auth:
    ## Authentication is off; the Service is only reachable in-cluster.
    ## If you enable it, connect with credentials via redis.host instead.
    enabled: false
  dataStorage:
    ## Persist data to a PVC. Off by default: Valkey holds only queue/cache
    ## state here.
    enabled: false
  ## Resource requests and limits for the Valkey pod
  resources: {}

## Resource requests and limits. Defaults to {} (no limits).
## ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
## e.g.:
## resources:
##   limits:
##     cpu: 1
##     memory: 1Gi
##   requests:
##     cpu: 50m
##     memory: 10Mi
resources: {}

## Metrics parameters
metrics:
  ## Enable metrics collection (sets PROMETHEUS_EXPORTER_ENABLED and renders the ServiceMonitor)
  enabled: false
  serviceMonitor:
    ## Enable a Prometheus ServiceMonitor
    enabled: false
    ## Namespace to deploy the ServiceMonitor into (defaults to release namespace)
    namespace: ""
    ## Scrape interval
    interval: "30s"
    ## Scrape timeout (empty uses the global default)
    scrapeTimeout: ""
    ## When true, preserves metric labels that collide with target labels
    honorLabels: false
    ## [RelabelConfigs] to apply to samples before scraping
    relabelings: []
    ## [MetricRelabelConfigs] to apply to samples before ingestion
    metricRelabelings: []
    ## Labels added to the ServiceMonitor metadata for operator discovery.
    ## Only needed if your VMAgent/Prometheus Operator filters by serviceMonitorSelector labels.
    ## Leave empty if your operator discovers all ServiceMonitors in the namespace.
    selector: {}
    ## Additional labels for the ServiceMonitor metadata
    additionalLabels: {}
    ## Annotations for the ServiceMonitor metadata
    annotations: {}
    ## Endpoint scheme (empty defaults to http)
    scheme: ""
    ## TLS configuration for the endpoint
    tlsConfig: {}
    ## Name of the secret containing metrics-username and metrics-password keys for basic auth.
    ## Leave empty to disable basic auth.
    credentialsSecret: ""

## Persistence parameters
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
persistence:
  ## Watched files volume
  watched:
    ## Enable persistence for watched import files
    enabled: true
    ## PVC size
    size: 1Gi
    ## Storage class name. Leave empty to use the cluster default storage class.
    storageClass: ""
    ## PVC access mode
    accessMode: ReadWriteOnce
  ## Public assets volume
  public:
    ## Enable persistence for public assets
    enabled: true
    ## PVC size
    size: 1Gi
    ## Storage class name. Leave empty to use the cluster default storage class.
    storageClass: ""
    ## PVC access mode
    accessMode: ReadWriteOnce
  ## Active Storage uploads volume
  storage:
    ## Enable persistence for Active Storage uploads
    enabled: true
    ## PVC size
    size: 1Gi
    ## Storage class name. Leave empty to use the cluster default storage class.
    storageClass: ""
    ## PVC access mode
    accessMode: ReadWriteOnce
  ## Database data volume
  db:
    ## Enable persistence for the database data directory
    enabled: true
    ## PVC size
    size: 5Gi
    ## Storage class name. Leave empty to use the cluster default storage class.
    storageClass: ""
    ## PVC access mode
    accessMode: ReadWriteOnce
