apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-matter-server.fullname" . }}-svc
  labels:
    {{- include "python-matter-server.labels" . | nindent 4 }}
    {{- with .Values.service.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: websocket
  selector:
    {{- include "python-matter-server.selectorLabels" . | nindent 4 }}
