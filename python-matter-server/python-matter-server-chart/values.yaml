## @section Image parameters
##

## Matter server image (matter-js/matterjs-server, successor to the archived
## home-assistant-libs/python-matter-server)
## ref: https://github.com/matter-js/matterjs-server/releases
## @param image.repository Matter server image repository
## @param image.tag Matter server image tag
##
image:
  repository: ghcr.io/matter-js/matterjs-server
  tag: "1.3.1"

## @section Matter Server parameters
##

## @param logLevel Log verbosity for the Matter server
## One of: silly | debug | info | notice | warn | error | fatal
##
logLevel: "info"

## @param storagePath Path inside the container where Matter commissioning data is persisted
##
storagePath: "/data"

## @param productionMode Set to true when the server is accessed through a reverse proxy/ingress
## Makes the built-in dashboard connect to the WebSocket server at the current
## URL instead of prompting for a server address (only needed behind a proxy;
## not needed with hostNetwork + direct/Service access).
##
productionMode: false

## @param fsGroup Group ownership applied recursively to the data PVC on mount
## The matterjs-server image runs as a non-root user (uid/gid 1000) and its
## Dockerfile chowns /data to 1000:1000, so this must stay 1000 unless the
## upstream image changes its runtime user.
##
fsGroup: 1000

## @param annotations Pod-level annotations
## The AppArmor annotation disables confinement for the matter-server container,
## which is required for Bluetooth and Matter transport to work correctly.
## ref: https://kubernetes.io/docs/tutorials/security/apparmor/
##
annotations:
  container.apparmor.security.beta.kubernetes.io/matter-server: unconfined

## @param replicaCount Number of replicas
##
replicaCount: 1

## @section Network parameters
##

## @param hostNetwork Enable host networking
## Required for Matter UDP multicast and device discovery on the local network.
##
hostNetwork: true

## @param dnsPolicy DNS policy to use when host networking is enabled
##
dnsPolicy: ClusterFirstWithHostNet

## @section Persistence parameters
##

## @param persistence.enabled Enable a PersistentVolumeClaim for Matter commissioning data
## @param persistence.storageClass StorageClass for the data PVC ("" uses the cluster default)
## @param persistence.accessMode PVC access mode
## @param persistence.size Size of the data PVC
##
persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: 1Gi

## @section Service parameters
##

## @param service.type Kubernetes Service type
## @param service.port Matter WebSocket API + built-in dashboard port (used by Home Assistant and for browser access)
## @param service.targetPort Port the server listens on inside the container
##
service:
  type: ClusterIP
  port: 5580
  targetPort: 5580

## @section Scheduling parameters
##

## @param nodeSelector Node labels for pod assignment
nodeSelector: {}

## @section Resource parameters
##

## @param resources Resource requests and limits for the Matter Server container
## ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
## e.g.:
##   resources:
##     limits:
##       cpu: 500m
##       memory: 500Mi
##     requests:
##       cpu: 10m
##       memory: 25Mi
##
resources: {}
